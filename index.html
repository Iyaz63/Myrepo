<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 min-h-screen text-slate-100 flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur border border-slate-800 p-8 rounded-2xl shadow-2xl text-center">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center mb-6 text-2xl font-bold border border-indigo-500/30">
            🚀
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-3">How are you guys?</h1>
        <p class="text-slate-400 text-sm mb-6">This is your live HTML preview. Edit the code on the left panel to see changes update instantly in real-time!</p>
        <button onclick="alert('Button clicked successfully!')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/30">
            Click Me
        </button>
    </div>
</body>
</html>
